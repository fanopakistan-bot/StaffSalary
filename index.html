<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BD / Admin Policy</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#f3d992;--gold2:#c99a3f;--ivory:#fff8ea;--ink:rgba(14,5,42,.8);--line:rgba(243,217,146,.35)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
/* BACKGROUND IMAGE: to restore your original photo, replace the "background:#1a0b45 ..." value below with:
   background:#1a0b45 url(data:image/jpeg;base64,YOUR_ORIGINAL_BASE64) center/cover fixed */
body{color:var(--ivory);font:400 17px/1.75 'Jost','Noto Sans SC',system-ui,sans-serif;background:radial-gradient(ellipse at 50% 0%,#3a1a8a 0%,#1a0b45 60%,#0a0320 100%) fixed;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(30,10,80,.55),rgba(10,3,32,.93));z-index:0}
body.ar,body.ur{font-family:'Noto Naskh Arabic',serif;line-height:1.95}
body.ur{font-family:'Noto Nastaliq Urdu','Noto Naskh Arabic',serif;line-height:2.5}
body.zh{font-family:'Noto Sans SC',sans-serif}
.spark{position:fixed;z-index:1;width:6px;height:6px;background:var(--gold);border-radius:50%;box-shadow:0 0 12px 3px rgba(243,217,146,.7);animation:fl 9s ease-in-out infinite;opacity:0}
@keyframes fl{0%{transform:translateY(40px) scale(.4);opacity:0}30%{opacity:.9}100%{transform:translateY(-140px) scale(1);opacity:0}}
.screen{position:relative;z-index:2;min-height:100vh;padding:56px 20px;display:none}
.screen.on{display:block;animation:scr .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes scr{from{opacity:0;transform:scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
#pick{text-align:center;display:none;flex-direction:column;align-items:center;justify-content:center}
#pick.on{display:flex}
.crest{width:84px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px auto}
h1{font:700 clamp(34px,7vw,64px)/1.15 'Cormorant Garamond','Noto Sans SC',serif;background:linear-gradient(100deg,#b98a33 0%,#fff1c2 30%,#e0b25a 50%,#fff1c2 70%,#b98a33 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
body.ar h1,body.ur h1{font-family:'Noto Naskh Arabic',serif;line-height:1.6}
@keyframes sh{to{background-position:-250% 0}}
h1 span{display:inline-block;animation:dn .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes dn{from{opacity:0;transform:translateY(-26px) rotateX(70deg)}to{opacity:1;transform:none}}
.sub{color:var(--gold);letter-spacing:.14em;font-size:15px;opacity:0;animation:fi 1s .9s forwards}
@keyframes fi{to{opacity:1}}
.langs{display:grid;grid-template-columns:repeat(2,minmax(150px,210px));gap:16px;margin-top:38px}
.langs button{font:inherit;cursor:pointer;color:var(--ivory);background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:18px 12px;font-size:22px;line-height:1.5;backdrop-filter:blur(10px);position:relative;overflow:hidden;opacity:0;animation:up .8s calc(1.1s + var(--i)*.13s) cubic-bezier(.2,.7,.2,1) forwards;transition:transform .35s,border-color .35s,box-shadow .35s}
.langs button small{display:block;font:500 12px 'Jost',sans-serif;color:var(--gold);letter-spacing:.12em}
.langs button:before{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,241,194,.3),transparent);transition:left .7s}
.langs button:hover:before{left:130%}
.langs button:hover,.langs button:focus-visible{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 12px 40px rgba(201,154,63,.35);outline:none}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
#doc{max-width:860px;margin:0 auto}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.bar button{font:500 14px 'Jost',sans-serif;cursor:pointer;color:var(--gold);background:var(--ink);border:1px solid var(--line);border-radius:30px;padding:8px 18px;transition:.3s}
.bar button:hover,.bar button.cur{background:var(--gold);color:#1a0b45}
.sw{display:flex;gap:8px;flex-wrap:wrap}
header.hd{text-align:center;margin-bottom:34px}
.card{background:var(--ink);border:1px solid var(--line);border-radius:20px;padding:30px clamp(20px,4vw,40px);margin-bottom:26px;backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(5,0,25,.55),inset 0 1px 0 rgba(255,241,194,.15)}
h2{font:700 clamp(23px,4vw,32px)/1.3 'Cormorant Garamond','Noto Sans SC',serif;color:var(--gold);margin-bottom:14px}
body.ar h2,body.ur h2{font-family:inherit}
h3{color:var(--gold);font-size:19px;margin:24px 0 6px}
b{color:#fff;font-weight:700}
.tw{overflow-x:auto;margin:20px 0 4px}
table{width:100%;border-collapse:collapse;text-align:center;min-width:300px}
th{background:linear-gradient(135deg,#c99a3f,#f3d992);color:#1a0b45;padding:12px;font-weight:700}
th:first-child{border-radius:12px 0 0 0}th:last-child{border-radius:0 12px 0 0}
body.ar th:first-child,body.ur th:first-child{border-radius:0 12px 0 0}body.ar th:last-child,body.ur th:last-child{border-radius:12px 0 0 0}
td{padding:11px;border-bottom:1px solid var(--line);transition:background .3s}
tr:hover td{background:rgba(243,217,146,.12)}
td:last-child{color:var(--gold);font-weight:700}
ol.c{list-style:none;padding:0;margin:12px 0}
ol.c li,.rule{display:flex;gap:16px;align-items:flex-start}
ol.c li{margin:10px 0}
.n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#c99a3f,#f3d992);color:#1a0b45;font:700 16px/1 'Jost',sans-serif}
.rule{padding:18px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border:0}
.rule h3{margin:0 0 2px}
.note{margin-top:16px;padding:14px 18px;border-radius:12px;background:rgba(243,217,146,.14);border-inline-start:3px solid var(--gold)}
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}.rv{opacity:1;transform:none}}
.cta-wrap{text-align:center;margin:0 0 26px}
.cta{display:inline-block;font:700 17px/1.4 'Jost','Noto Sans SC',system-ui,sans-serif;text-decoration:none;color:#1a0b45;background:linear-gradient(135deg,#c99a3f,#fff1c2 50%,#e0b25a);background-size:200% 100%;padding:14px 34px;border-radius:40px;border:1px solid var(--gold);box-shadow:0 8px 30px rgba(201,154,63,.45);animation:pulse 2.4s ease-in-out infinite;transition:transform .3s,background-position .6s}
body.ar .cta,body.ur .cta{font-family:inherit}
.cta:hover,.cta:focus-visible{transform:translateY(-3px) scale(1.03);background-position:100% 0;outline:none}
@keyframes pulse{0%,100%{box-shadow:0 8px 30px rgba(201,154,63,.35)}50%{box-shadow:0 8px 42px rgba(243,217,146,.75)}}
@media(max-width:420px){.langs{grid-template-columns:1fr}}
</style>
</head>

en:{n:'English',s:'',dir:'ltr',t:'BD / Admin Policy',ah:'BD Revenue & Salary Table',ai:'The BD receives <b>20% of the revenue generated by their personally invited/managed agencies</b>.',th:['Monthly Agency Revenue','BD Salary — 20%'],ih:'BD Identity Requirement',ii:'An individual receives the official <b>BD Identity/Tag</b> only after successfully completing <b>both</b> conditions:',c:['Successfully invite <b>10 active agencies</b>','Reach <b>100M Diamonds</b> in total monthly agency revenue'],pn:'Reaching 3,000M Diamonds qualifies the BD for promotion to <b>Admin</b>.',sh:'Admin Revenue & Salary Table',si:'Admins receive <b>25% of the revenue generated by their own agencies</b>.',th2:['Monthly Agency Revenue','Admin Salary — 25%'],rh:'Important Structural Rules',back:'Change language',
r:[['Independent Identities','BD and Admin are two separate identities. Neither position is subordinate to the other.'],['No Override Commission','There is <b>no override commission, downline commission, or secondary commission</b>. A BD/Admin earns only from the agencies directly associated with their own account.'],['Direct Agency Revenue','Only revenue generated by a BD/Admin’s own invited/assigned agencies is counted toward their salary and promotion targets.'],['Promotion to Admin','An existing BD may be promoted to Admin after successfully achieving <b>3,000M Diamonds</b> in qualifying monthly agency revenue, subject to company verification.'],['Admin Identity','An Admin receives the official <b>Admin identity/tag immediately upon reaching the minimum qualification of 3,000M Diamonds</b>.'],['Reporting Structure','Every BD and Admin must report directly to their <b>assigned Manager</b> for operational matters, performance, compliance, reporting, and company instructions.'],['No Cross-Commission','If BD A introduces BD B, BD A does <b>not</b> receive any percentage of BD B’s revenue. Likewise, an Admin does not receive revenue from another BD or Admin.'],['Revenue Verification','All revenue figures are subject to company verification. Only valid, completed and approved recharge/revenue transactions will be counted toward targets.'],['Monthly Calculation','Salary/commission is calculated based on the qualifying revenue generated during the applicable monthly settlement period.'],['Policy Compliance','The company reserves the right to suspend, review, or remove a BD/Admin identity in cases of fraud, manipulation, fake accounts, recharge abuse, agency misconduct, or violation of company policies.']]},
zh:{n:'中文',s:'Chinese',dir:'ltr',t:'BD / 管理员政策',ah:'BD 收入与薪资表',ai:'BD 可获得其<b>亲自邀请/管理的代理所产生收入的 20%</b>。',th:['每月代理收入','BD 薪资 — 20%'],ih:'BD 身份要求',ii:'个人必须同时完成以下<b>两项</b>条件，方可获得官方 <b>BD 身份/标识</b>：',c:['成功邀请 <b>10 个活跃代理</b>','每月代理总收入达到 <b>100M 钻石</b>'],pn:'达到 3,000M 钻石即可晋升为<b>管理员</b>。',sh:'管理员收入与薪资表',si:'管理员可获得<b>其自有代理所产生收入的 25%</b>。',th2:['每月代理收入','管理员薪资 — 25%'],rh:'重要结构规则',back:'更换语言',
r:[['独立身份','BD 与管理员是两个相互独立的身份，任何一方均不隶属于另一方。'],['无级差佣金','<b>不设级差佣金、下线佣金或二级佣金</b>。BD/管理员仅从与其自身账号直接关联的代理处获得收入。'],['直属代理收入','仅 BD/管理员自己邀请/分配的代理所产生的收入，才计入其薪资和晋升目标。'],['晋升为管理员','现任 BD 在每月合格代理收入成功达到 <b>3,000M 钻石</b>后可晋升为管理员，须经公司核实。'],['管理员身份','管理员在达到 <b>3,000M 钻石</b>的最低资格后，<b>立即获得官方管理员身份/标识</b>。'],['汇报架构','每位 BD 和管理员在运营事务、业绩、合规、汇报及公司指令方面，必须直接向其<b>指定经理</b>汇报。'],['无交叉佣金','若 BD A 介绍了 BD B，BD A <b>不会</b>获得 BD B 收入的任何比例。同样，管理员也不会从其他 BD 或管理员处获得收入。'],['收入核实','所有收入数据均须经公司核实。只有有效、已完成且已批准的充值/收入交易才会计入目标。'],['按月结算','薪资/佣金依据适用月度结算周期内产生的合格收入计算。'],['政策合规','如发生欺诈、操纵、虚假账号、充值滥用、代理违规或违反公司政策的情况，公司保留暂停、审查或撤销 BD/管理员身份的权利。']]},
ur:{n:'اردو',s:'Urdu',dir:'rtl',t:'BD / ایڈمن پالیسی',ah:'BD کی آمدنی اور تنخواہ کا جدول',ai:'BD کو <b>اپنی ذاتی طور پر مدعو/منظم کردہ ایجنسیوں سے حاصل ہونے والی آمدنی کا 20٪</b> ملتا ہے۔',th:['ماہانہ ایجنسی آمدنی','BD کی تنخواہ — 20٪'],ih:'BD شناخت کی شرائط',ii:'کسی فرد کو سرکاری <b>BD شناخت/ٹیگ</b> صرف اسی صورت میں ملتا ہے جب وہ <b>دونوں</b> شرائط کامیابی سے پوری کرے:',c:['<b>10 فعال ایجنسیوں</b> کو کامیابی سے مدعو کرنا','ماہانہ ایجنسی کی کل آمدنی میں <b>100M ڈائمنڈز</b> تک پہنچنا'],pn:'3,000M ڈائمنڈز تک پہنچنے پر BD <b>ایڈمن</b> میں ترقی کا اہل ہو جاتا ہے۔',sh:'ایڈمن کی آمدنی اور تنخواہ کا جدول',si:'ایڈمن کو <b>اپنی ایجنسیوں سے حاصل ہونے والی آمدنی کا 25٪</b> ملتا ہے۔',th2:['ماہانہ ایجنسی آمدنی','ایڈمن کی تنخواہ — 25٪'],rh:'اہم ساختی قواعد',back:'زبان تبدیل کریں',
r:[['آزاد شناختیں','BD اور ایڈمن دو الگ شناختیں ہیں۔ کوئی بھی عہدہ دوسرے کے ماتحت نہیں ہے۔'],['کوئی اوور رائیڈ کمیشن نہیں','<b>کوئی اوور رائیڈ کمیشن، ڈاؤن لائن کمیشن یا ثانوی کمیشن نہیں ہے</b>۔ BD/ایڈمن صرف ان ایجنسیوں سے کماتا ہے جو براہِ راست اس کے اپنے اکاؤنٹ سے منسلک ہوں۔'],['براہِ راست ایجنسی آمدنی','صرف BD/ایڈمن کی اپنی مدعو/تفویض کردہ ایجنسیوں سے پیدا ہونے والی آمدنی ہی اس کی تنخواہ اور ترقی کے اہداف میں شمار ہوتی ہے۔'],['ایڈمن میں ترقی','موجودہ BD کو ماہانہ اہل ایجنسی آمدنی میں <b>3,000M ڈائمنڈز</b> کامیابی سے حاصل کرنے پر، کمپنی کی تصدیق سے مشروط، ایڈمن بنایا جا سکتا ہے۔'],['ایڈمن شناخت','ایڈمن کو <b>3,000M ڈائمنڈز کی کم از کم اہلیت پوری کرتے ہی فوراً سرکاری ایڈمن شناخت/ٹیگ</b> مل جاتا ہے۔'],['رپورٹنگ ڈھانچہ','ہر BD اور ایڈمن آپریشنل امور، کارکردگی، تعمیل، رپورٹنگ اور کمپنی کی ہدایات کے لیے براہِ راست اپنے <b>مقرر کردہ مینیجر</b> کو رپورٹ کرے گا۔'],['کوئی کراس کمیشن نہیں','اگر BD A، BD B کو متعارف کرائے تو BD A کو BD B کی آمدنی کا کوئی حصہ <b>نہیں</b> ملے گا۔ اسی طرح ایڈمن کو کسی دوسرے BD یا ایڈمن کی آمدنی نہیں ملتی۔'],['آمدنی کی تصدیق','تمام آمدنی کے اعداد و شمار کمپنی کی تصدیق سے مشروط ہیں۔ صرف درست، مکمل اور منظور شدہ ری چارج/آمدنی کے لین دین اہداف میں شمار ہوں گے۔'],['ماہانہ حساب','تنخواہ/کمیشن کا حساب متعلقہ ماہانہ تصفیہ مدت کے دوران پیدا ہونے والی اہل آمدنی کی بنیاد پر کیا جاتا ہے۔'],['پالیسی کی تعمیل','دھوکہ دہی، ہیرا پھیری، جعلی اکاؤنٹس، ری چارج کے غلط استعمال، ایجنسی کی بدانتظامی یا کمپنی پالیسیوں کی خلاف ورزی کی صورت میں کمپنی BD/ایڈمن شناخت کو معطل، زیرِ جائزہ یا ختم کرنے کا حق محفوظ رکھتی ہے۔']]},
