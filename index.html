body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(30,10,80,.55),rgba(10,3,32,.93));z-index:0}
body.ar,body.ur{font-family:'Noto Naskh Arabic',serif;line-height:1.95}
body.ur{font-family:'Noto Nastaliq Urdu','Noto Naskh Arabic',serif;line-height:2.5}
body.zh{font-family:'Noto Sans SC',sans-serif}
.spark{position:fixed;z-index:1;width:6px;height:6px;background:var(--gold);border-radius:50%;box-shadow:0 0 12px 3px rgba(243,217,146,.7);animation:fl 9s ease-in-out infinite;opacity:0}
@keyframes fl{0%{transform:translateY(40px) scale(.4);opacity:0}30%{opacity:.9}100%{transform:translateY(-140px) scale(1);opacity:0}}
.screen{position:relative;z-index:2;min-height:100vh;padding:56px 20px;display:none}
.screen.on{display:block;animation:scr .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes scr{from{opacity:0;transform:scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
#pick{text-align:center;display:none;flex-direction:column;align-items:center;justify-content:center}
#pick.on{display:flex}
.crest{width:84px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px auto}
h1{font:700 clamp(34px,7vw,64px)/1.15 'Cormorant Garamond','Noto Sans SC',serif;background:linear-gradient(100deg,#b98a33 0%,#fff1c2 30%,#e0b25a 50%,#fff1c2 70%,#b98a33 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
body.ar h1,body.ur h1{font-family:'Noto Naskh Arabic',serif;line-height:1.6}
@keyframes sh{to{background-position:-250% 0}}
h1 span{display:inline-block;animation:dn .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes dn{from{opacity:0;transform:translateY(-26px) rotateX(70deg)}to{opacity:1;transform:none}}
.sub{color:var(--gold);letter-spacing:.14em;font-size:15px;opacity:0;animation:fi 1s .9s forwards}
@keyframes fi{to{opacity:1}}
.langs{display:grid;grid-template-columns:repeat(2,minmax(150px,210px));gap:16px;margin-top:38px}
.langs button{font:inherit;cursor:pointer;color:var(--ivory);background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:18px 12px;font-size:22px;line-height:1.5;backdrop-filter:blur(10px);position:relative;overflow:hidden;opacity:0;animation:up .8s calc(1.1s + var(--i)*.13s) cubic-bezier(.2,.7,.2,1) forwards;transition:transform .35s,border-color .35s,box-shadow .35s}
.langs button small{display:block;font:500 12px 'Jost',sans-serif;color:var(--gold);letter-spacing:.12em}
.langs button:before{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,241,194,.3),transparent);transition:left .7s}
.langs button:hover:before{left:130%}
.langs button:hover,.langs button:focus-visible{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 12px 40px rgba(201,154,63,.35);outline:none}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
#doc{max-width:860px;margin:0 auto}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.bar button{font:500 14px 'Jost',sans-serif;cursor:pointer;color:var(--gold);background:var(--ink);border:1px solid var(--line);border-radius:30px;padding:8px 18px;transition:.3s}
.bar button:hover,.bar button.cur{background:var(--gold);color:#1a0b45}
.sw{display:flex;gap:8px;flex-wrap:wrap}
header.hd{text-align:center;margin-bottom:34px}
.card{background:var(--ink);border:1px solid var(--line);border-radius:20px;padding:30px clamp(20px,4vw,40px);margin-bottom:26px;backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(5,0,25,.55),inset 0 1px 0 rgba(255,241,194,.15)}
h2{font:700 clamp(23px,4vw,32px)/1.3 'Cormorant Garamond','Noto Sans SC',serif;color:var(--gold);margin-bottom:14px}
body.ar h2,body.ur h2{font-family:inherit}
h3{color:var(--gold);font-size:19px;margin:24px 0 6px}
b{color:#fff;font-weight:700}
.tw{overflow-x:auto;margin:20px 0 4px}
table{width:100%;border-collapse:collapse;text-align:center;min-width:300px}
th{background:linear-gradient(135deg,#c99a3f,#f3d992);color:#1a0b45;padding:12px;font-weight:700}
th:first-child{border-radius:12px 0 0 0}th:last-child{border-radius:0 12px 0 0}
body.ar th:first-child,body.ur th:first-child{border-radius:0 12px 0 0}body.ar th:last-child,body.ur th:last-child{border-radius:12px 0 0 0}
td{padding:11px;border-bottom:1px solid var(--line);transition:background .3s}
tr:hover td{background:rgba(243,217,146,.12)}
td:last-child{color:var(--gold);font-weight:700}
ol.c{list-style:none;padding:0;margin:12px 0}
ol.c li,.rule{display:flex;gap:16px;align-items:flex-start}
ol.c li{margin:10px 0}
.n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#c99a3f,#f3d992);color:#1a0b45;font:700 16px/1 'Jost',sans-serif}
.rule{padding:18px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border:0}
.rule h3{margin:0 0 2px}
.note{margin-top:16px;padding:14px 18px;border-radius:12px;background:rgba(243,217,146,.14);border-inline-start:3px solid var(--gold)}
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}.rv{opacity:1;transform:none}}
.cta-wrap{text-align:center;margin:0 0 26px}
.cta{display:inline-block;font:700 17px/1.4 'Jost','Noto Sans SC',system-ui,sans-serif;text-decoration:none;color:#1a0b45;background:linear-gradient(135deg,#c99a3f,#fff1c2 50%,#e0b25a);background-size:200% 100%;padding:14px 34px;border-radius:40px;border:1px solid var(--gold);box-shadow:0 8px 30px rgba(201,154,63,.45);animation:pulse 2.4s ease-in-out infinite;transition:transform .3s,background-position .6s}
body.ar .cta,body.ur .cta{font-family:inherit}
.cta:hover,.cta:focus-visible{transform:translateY(-3px) scale(1.03);background-position:100% 0;outline:none}
@keyframes pulse{0%,100%{box-shadow:0 8px 30px rgba(201,154,63,.35)}50%{box-shadow:0 8px 42px rgba(243,217,146,.75)}}
@media(max-width:420px){.langs{grid-template-columns:1fr}}
</style>
